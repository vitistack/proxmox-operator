apiVersion: vitistack.io/v1alpha1
kind: Machine
metadata:
  name: talos-1-11-5-vm
spec:
  name: talos-1-11-5-vm
  machineClass: small
  os:
    family: linux
    distribution: talos
    version: "1.11.5"
    #imageID: "local:iso/talos-v1.11.5-nocloud-amd64.iso"
    imageID: "local:iso/talos-v1.12.0-beta.1-qemu-nocloud-amd64.iso"
  network:
    assignPublicIP: false
    interfaces:
    - name: eth0
      primary: true
  disks:
  - name: root
    sizeGB: 10
    boot: true
  provider: proxmox