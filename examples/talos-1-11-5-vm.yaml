apiVersion: vitistack.io/v1alpha1
kind: Machine
metadata:
  name: talos-1-11-5-vm
spec:
  name: talos-1-11-5-vm
  machineClass: small
  os:
    family: linux
    distribution: talos
    version: "1.11.5"
    imageID: "cephfsExternal:iso/metal-amd64.iso"
  network:
    assignPublicIP: false
    interfaces:
      - name: eth0
        primary: true
  disks:
    - name: root
      sizeGB: 10
      boot: true
  provider: proxmox
