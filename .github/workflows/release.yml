name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write # Required for keyless signing with Sigstore

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/vitistack/viti-proxmox-operator
  HELM_REGISTRY: ghcr.io/vitistack/helm

jobs:
  # Build OCI images (add ARM back when repo is public or ARM runners support private repos)
  build-image:
    name: Build Image (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          # Uncomment for ARM support (requires QEMU on private repos, or native runner on public repos)
          # - platform: linux/arm64
          #   arch: arm64
          #   # runner: ubuntu-24.04-arm  # Use this instead of ubuntu-latest for public repos
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Uncomment for ARM support (QEMU emulation)
      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@v3
      #   with:
      #     platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5.10.0
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Package Helm chart in parallel with image builds
  package-helm:
    name: Package Helm Chart
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1
        with:
          version: 'latest'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update chart version, appVersion and values
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          yq -i ".version = \"${VERSION}\"" charts/proxmox-operator/Chart.yaml
          yq -i ".appVersion = \"${VERSION}\"" charts/proxmox-operator/Chart.yaml
          yq -i ".image.tag = \"${VERSION}\"" charts/proxmox-operator/values.yaml

      - name: Package Helm chart
        run: |
          helm package charts/proxmox-operator

      - name: Generate source code SBOM
        run: make sbom-source SBOM_OUTPUT_DIR=.

      - name: Upload chart artifact
        uses: actions/upload-artifact@v6
        with:
          name: helm-chart
          path: proxmox-operator-*.tgz
          retention-days: 1

      - name: Upload source SBOM artifact
        uses: actions/upload-artifact@v6
        with:
          name: sbom-source
          path: |
            sbom-source.cdx.json
            sbom-source.spdx.json
          retention-days: 90

  # Merge multi-arch manifests and sign everything
  publish-and-sign:
    name: Publish & Sign
    needs: [build-image, package-helm]
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Download Helm chart
        uses: actions/download-artifact@v7
        with:
          name: helm-chart
          path: /tmp/helm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1
        with:
          version: 'latest'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5.10.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Push Helm chart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          helm push /tmp/helm/proxmox-operator-*.tgz oci://${{ env.HELM_REGISTRY }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign container image
        run: cosign sign --yes ${{ env.IMAGE_NAME }}:${{ needs.package-helm.outputs.version }}

      - name: Sign Helm chart
        run: cosign sign --yes ${{ env.HELM_REGISTRY }}/proxmox-operator:${{ needs.package-helm.outputs.version }}

      - name: Checkout code for Makefile
        uses: actions/checkout@v6

      - name: Generate container SBOM
        run: make sbom-container IMG=${{ env.IMAGE_NAME }}:${{ needs.package-helm.outputs.version }} SBOM_OUTPUT_DIR=.

      - name: Attach SBOM to container image
        run: |
          cosign attach sbom --sbom sbom-container.cdx.json ${{ env.IMAGE_NAME }}:${{ needs.package-helm.outputs.version }}

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v6
        with:
          name: sbom-container
          path: |
            sbom-container.cdx.json
            sbom-container.spdx.json
          retention-days: 90

  # Create GitHub Release with SBOMs
  create-release:
    name: Create GitHub Release
    needs: [publish-and-sign, package-helm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download source SBOM
        uses: actions/download-artifact@v7
        with:
          name: sbom-source
          path: sbom

      - name: Download container SBOM
        uses: actions/download-artifact@v7
        with:
          name: sbom-container
          path: sbom

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Check if release already exists
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists, uploading SBOM assets..."
            gh release upload "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --clobber \
              sbom/sbom-source.cdx.json \
              sbom/sbom-source.spdx.json \
              sbom/sbom-container.cdx.json \
              sbom/sbom-container.spdx.json
          else
            echo "Creating new release ${{ github.ref_name }}..."
            gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --generate-notes \
              --latest \
              sbom/sbom-source.cdx.json \
              sbom/sbom-source.spdx.json \
              sbom/sbom-container.cdx.json \
              sbom/sbom-container.spdx.json
          fi
