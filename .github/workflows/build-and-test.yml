name: Build and Test

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['main', 'master']

jobs:
  build-test-checksecurity:
    name: Build, lint, test and check security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6.1.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # Cache bin folder (Go tools and built binaries)
      - name: Cache bin folder
        uses: actions/cache@v5.0.1
        with:
          path: bin
          key: ${{ runner.os }}-bin-${{ hashFiles('go.mod', 'go.sum', 'Makefile') }}
          restore-keys: |
            ${{ runner.os }}-bin-

      - name: Install dependencies
        run: |
          go mod download

      - name: Build
        run: |
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}"
          VERSION="${VERSION#v*}"
          echo "Version $VERSION"
          make build

      - name: Lint
        run: |
          make lint

      - name: Run tests
        run: |
          make test
          go tool cover -func=cover.out

      - name: Upload coverage
        uses: actions/upload-artifact@v5.0.0
        with:
          name: coverage
          path: cover.out
          retention-days: 7

      - name: Run gosec
        run: |
          make gosec

      - name: Run security scan
        run: |
          make govulncheck
