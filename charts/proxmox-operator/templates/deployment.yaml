apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "proxmox-operator.fullname" . }}
  labels:
    {{- include "proxmox-operator.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "proxmox-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "proxmox-operator.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "proxmox-operator.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            # Logging configuration
            - name: LOG_LEVEL
              value: {{ .Values.logging.level | quote }}
            - name: LOG_JSON
              value: {{ .Values.logging.json | quote }}
            # Proxmox connection settings (from secret)
            - name: PROXMOX_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: PROXMOX_ENDPOINT
            - name: PROXMOX_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: PROXMOX_USERNAME
                  optional: true
            - name: PROXMOX_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: PROXMOX_PASSWORD
                  optional: true
            - name: PROXMOX_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: PROXMOX_TOKEN_ID
                  optional: true
            - name: PROXMOX_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: PROXMOX_TOKEN_SECRET
                  optional: true
            - name: PROXMOX_INSECURE_TLS
              value: {{ .Values.proxmox.insecureTLS | quote }}
            # VM management settings
            - name: PROXMOX_VM_ID_START
              value: {{ .Values.vm.idStart | quote }}
            - name: PROXMOX_NODE_SELECTION
              value: {{ .Values.vm.nodeSelection | quote }}
            {{- if .Values.vm.allowedNodes }}
            - name: PROXMOX_ALLOWED_NODES
              value: {{ .Values.vm.allowedNodes | quote }}
            {{- end }}
            - name: PROXMOX_DEFAULT_STORAGE
              value: {{ .Values.vm.defaultStorage | quote }}
            - name: PROXMOX_DEFAULT_NETWORK
              value: {{ .Values.vm.defaultNetwork | quote }}
            - name: PROXMOX_NETWORK_MODEL
              value: {{ .Values.vm.networkModel | quote }}
            {{- if .Values.vm.defaultVlan }}
            - name: PROXMOX_DEFAULT_VLAN
              value: {{ .Values.vm.defaultVlan | quote }}
            {{- end }}
            {{- if .Values.vm.defaultMtu }}
            - name: PROXMOX_DEFAULT_MTU
              value: {{ .Values.vm.defaultMtu | quote }}
            {{- end }}
            - name: PROXMOX_DEFAULT_CPU_TYPE
              value: {{ .Values.vm.defaultCpuType | quote }}
            - name: PROXMOX_ENABLE_NUMA
              value: {{ .Values.vm.enableNuma | quote }}
            - name: PROXMOX_SCSI_CONTROLLER
              value: {{ .Values.vm.scsiController | quote }}
            - name: PROXMOX_ENABLE_QEMU_AGENT
              value: {{ .Values.vm.enableQemuAgent | quote }}
            - name: PROXMOX_START_ON_CREATE
              value: {{ .Values.vm.startOnCreate | quote }}
            # Network configuration settings
            - name: IP_SOURCE
              value: {{ .Values.network.ipSource | quote }}
            - name: MAC_SET
              value: {{ .Values.network.macSet | quote }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
